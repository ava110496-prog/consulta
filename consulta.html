<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consulta Especial</title>
  <style>
    body {
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      color: #333;
      margin: 0;
      padding: 0;
    }

    h1 {
      color: #d6336c;
      font-size: 3em;
      margin-top: 30px;
      animation: latido 1s infinite;
    }

    @keyframes latido {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    p {
      font-size: 1.5em;
      margin: 20px;
    }

    img {
      width: 300px;
      margin: 20px auto;
      display: block;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(214, 51, 108, 0.5);
    }

    button {
      background-color: #d6336c;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2em;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ff4d6d;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <h1>¿Quieres ser mi novia? 💖</h1>
  <p>Esta página está hecha con mucho cariño solo para ti.</p>
  <!-- Aquí va tu imagen desde Pinterest -->
  <img src="https://i.pinimg.com/1200x/2b/3b/6b/2b3b6b6bf117cd01e421b05beaa22d19.jpg" alt="Snoopy con corazones">
  <button onclick="alert('¡Sabía que dirías que sí! ❤️')">Sí, acepto 💍</button>
  <button class="no" onclick="alert('Oh... lo intentaré de nuevo 😅')">No</button>
</body>
</html>
