<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pregunta Especial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            color: #d6336c;
            font-size: 3em;
        }
        .botones {
            margin-top: 20px;
        }
        button {
            font-size: 1.2em;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .si {
            background-color: #ff6b6b;
            color: white;
        }
        .no {
            background-color: #adb5bd;
            color: white;
        }
    </style>
</head>
<body>
    <h1>¿Quieres ser mi novia?</h1>
    <div class="botones">
        <button class="si" onclick="alert('¡Sabía que dirías que sí! ❤️')">Sí</button>
        <button class="no" onclick="alert('Oh... lo intentaré de nuevo 😅')">No</button>
    </div>
</body>
</html>
